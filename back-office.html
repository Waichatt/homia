    return '';
  }

  function getPropertyBadgeIcon(type) {
    if (type === 'building' || type === 'office') {
      return `<svg class="w-6 h-6 opacity-85" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path></svg>`;
    } else if (type === 'land') {
      return `<svg class="w-6 h-6 opacity-85" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path></svg>`;
    } else if (type === 'store') {
      return `<svg class="w-6 h-6 opacity-85" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M3 3h18v4H3V3zm2 4v12a2 2 0 002 2h10a2 2 0 002-2V7M9 10a3 3 0 006 0" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path></svg>`;
    } else {
      return `<svg class="w-6 h-6 opacity-85" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path></svg>`;
    }
  }

  function renderCategory(catKey) {
    const item = DATA[catKey];
    if (!item) return;

    // 1. Search & Filters Section
    const filtersHtml = item.filters.map(f => `
      <div class="relative flex items-center justify-between px-2.5 py-1.5 border border-slate-200 rounded-lg bg-white ${f.fullCol ? 'col-span-2' : ''}">
        <div class="flex items-center gap-1 text-slate-700 font-medium truncate">
          ${getIconSvg(f.icon)}
          <span class="truncate">${f.text}</span>
        </div>
        <svg class="w-3 h-3 text-slate-400 shrink-0 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path d="M19 9l-7 7-7-7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
        </svg>
      </div>
    `).join('');

    const gridColsClass = item.filters.length === 3 ? 'grid-cols-3' : 'grid-cols-3';

    document.getElementById('sectionFilters').innerHTML = `
      <div class="flex items-center gap-2.5 p-2.5 border border-slate-200 rounded-xl bg-slate-50/70 focus-within:border-brand-teal transition shadow-2xs">
        <svg class="w-4 h-4 text-brand-teal shrink-0" fill="currentColor" viewBox="0 0 20 20">
          <path clip-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" fill-rule="evenodd"></path>
        </svg>
        <div class="leading-tight flex-1">
          <p class="text-[13px] font-semibold text-slate-800">${item.locationTitle}</p>
          <p class="text-[11px] text-slate-500">${item.locationSubtitle}</p>
        </div>
      </div>
      <div class="grid ${gridColsClass} gap-2 text-xs">
        ${filtersHtml}
      </div>
      <button class="w-full bg-brand-navy hover:bg-brand-navyHover text-white py-2.5 rounded-xl font-medium text-xs tracking-wide shadow-sm active:scale-[0.99] transition flex items-center justify-center gap-1.5">
        <span>Analizar mercado</span>
      </button>
    `;

    // 2. Comparables Table
    document.getElementById('comparablesCount').textContent = `(${item.comparablesCount})`;

    const theadHtml = `
      <thead>
        <tr class="bg-slate-50 text-slate-500 border-b border-slate-200 font-semibold uppercase tracking-tighter">
          ${item.table.headers.map((h, idx) => {
            let alignClass = 'text-left';
            if (idx === 0) return `<th class="py-2 pl-2 pr-1 w-4">${h}</th>`;
            if (idx === item.table.headers.length - 1) return `<th class="py-2 pr-2 pl-1 text-right">${h.replace(' ', '<br/>')}</th>`;
            if (h.includes('Sup.') || h.includes('Días') || h.includes('Ajuste') || h.includes('Terreno')) alignClass = 'text-center';
            if (h.includes('Precio')) alignClass = 'text-right';
            return `<th class="py-2 px-1 ${alignClass}">${h.replace(' (', '<br/>(')}</th>`;
          }).join('')}
        </tr>
      </thead>
    `;

    const isCasa = catKey === 'casa';
    const tbodyHtml = `
      <tbody class="divide-y divide-slate-100 font-normal text-slate-700">
        ${item.table.rows.map(row => `
          <tr class="hover:bg-slate-50/80 transition-colors">
            <td class="py-2 pl-2 pr-1 font-semibold text-slate-900">${row.num}</td>
            <td class="py-2 px-1">
              <p class="font-medium text-slate-900 leading-tight">${row.title}</p>
              <p class="text-[9px] text-slate-400">${row.sub}</p>
            </td>
            ${isCasa ? `<td class="py-2 px-1 text-center font-medium text-slate-800">${row.land}</td>` : ''}
            <td class="py-2 px-1 text-center">
              <span class="font-semibold text-slate-800">${row.sup}</span>
              ${row.supSub ? `<span class="block text-[8.5px] text-slate-400">${row.supSub}</span>` : ''}
            </td>
            <td class="py-2 px-1 text-right font-medium text-slate-900">${row.price}</td>
            <td class="py-2 px-1 text-center text-slate-500">${row.days}</td>
            <td class="py-2 px-1 text-center font-medium ${row.adjColor}">${row.adj}</td>
            <td class="py-2 pr-2 pl-1 text-right font-semibold text-slate-900">${row.valM2}</td>
          </tr>
        `).join('')}
      </tbody>
    `;
    document.getElementById('comparablesTable').innerHTML = theadHtml + tbodyHtml;

    // 3. Target Property Card
    const renderRowCells = (cells, colCountClass) => `
      <div class="grid ${colCountClass} gap-1 py-1.5 text-center">
        ${cells.map(c => `
          <div>
            <span class="text-[9px] ${c.highlight ? 'text-brand-teal font-semibold' : 'text-slate-400'} uppercase tracking-tight block">${c.label}</span>
            <span class="text-xs font-bold ${c.highlight ? 'text-slate-900' : 'text-slate-800'}">${c.val}</span>
          </div>
        `).join('')}
      </div>
    `;

    const r1Cols = item.target.row1.length === 4 ? 'grid-cols-4' : 'grid-cols-3';
    const r2Cols = item.target.row2.length === 5 ? 'grid-cols-5' : (item.target.row2.length === 4 ? 'grid-cols-4' : 'grid-cols-3');
    const r3Cols = item.target.row3 ? (item.target.row3.length === 3 ? 'grid-cols-3' : 'grid-cols-4') : '';

    let rowsHtml = `
      ${renderRowCells(item.target.row1, r1Cols)}
      <div class="border-t border-slate-100"></div>
      ${renderRowCells(item.target.row2, r2Cols)}
    `;

    if (item.target.row3) {
      rowsHtml += `
        <div class="border-t border-slate-100"></div>
        ${renderRowCells(item.target.row3, r3Cols)}
      `;
    }

    document.getElementById('sectionTargetProperty').innerHTML = `
      <div class="flex justify-between items-center mb-1.5 px-0.5">
        <h2 class="text-xs font-bold text-slate-900">${item.target.titleSection}</h2>
        <button class="text-[11px] font-medium text-sky-600 hover:text-sky-700 flex items-center gap-0.5">
          <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
          </svg>
          Editar
        </button>
      </div>
      <div class="border border-slate-200 rounded-xl p-2.5 bg-white shadow-2xs">
        <div class="flex items-center gap-2.5 pb-2 border-b border-slate-100">
          <div class="w-10 h-10 rounded-lg overflow-hidden bg-slate-100 shrink-0 border border-slate-200">
            <div class="w-full h-full bg-gradient-to-tr from-sky-800 to-slate-900 flex items-center justify-center text-white">
              ${getPropertyBadgeIcon(item.target.iconType)}
            </div>
          </div>
          <div>
            <h3 class="text-xs font-bold text-slate-900 leading-tight">${item.target.name}</h3>
            <p class="text-[10px] text-slate-500">${item.target.location}</p>
          </div>
        </div>
        ${rowsHtml}
      </div>
    `;

    // 4. ACM Results Section
    document.getElementById('sectionACMResults').innerHTML = `
      <h2 class="text-xs font-bold text-slate-900 mb-2 px-0.5">Resultados del ACM</h2>
      <div class="grid grid-cols-3 gap-1.5 mb-2.5">
        <div class="bg-teal-50/70 border border-teal-300 rounded-xl p-2 text-center flex flex-col justify-between shadow-2xs">
          <span class="text-[8.5px] font-semibold uppercase tracking-tight text-teal-800">Valor de mercado</span>
          <p class="text-[12.5px] font-extrabold text-teal-950 leading-tight mt-1">${item.results.market}</p>
        </div>
        <div class="bg-slate-50 border border-slate-200 rounded-xl p-2 text-center flex flex-col justify-between shadow-2xs">
          <span class="text-[8.5px] font-medium uppercase tracking-tight text-slate-600">Valor sugerido<br/>de publicación</span>
          <p class="text-[12.5px] font-extrabold text-brand-navy leading-tight mt-0.5">${item.results.suggested}</p>
        </div>
        <div class="bg-slate-50/70 border border-slate-200 rounded-xl p-2 text-center flex flex-col justify-between shadow-2xs">
          <span class="text-[8.5px] font-medium uppercase tracking-tight text-slate-500">Fuera de<br/>mercado</span>
          <p class="text-[12.5px] font-bold text-slate-700 leading-tight mt-0.5">${item.results.offMarket}</p>
        </div>
      </div>
      <div class="bg-slate-50 border border-slate-100 rounded-lg p-2 text-center space-y-0.5">
        <p class="text-[11px] font-semibold text-slate-700">
          Rango estimado: <span class="text-slate-900 font-bold">${item.results.range}</span>
        </p>
        <p class="text-[10px] text-slate-500">
          ${item.results.note}
        </p>
      </div>
    `;
  }

  document.addEventListener('DOMContentLoaded', () => {
    const tabButtons = document.querySelectorAll('#categoryTabs button');
    const container = document.getElementById('dynamicContainer');

    tabButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        const cat = btn.getAttribute('data-category');
        
        // Update tab styling
        tabButtons.forEach(b => {
          b.className = 'px-3 py-1.5 text-xs font-medium text-slate-600 hover:text-brand-navy whitespace-nowrap transition';
        });
        btn.className = 'px-3 py-1.5 text-xs font-semibold rounded-md bg-brand-navy text-white whitespace-nowrap shadow-sm transition';

        // Transition content smoothly
        container.style.opacity = '0.35';
        setTimeout(() => {
          renderCategory(cat);
          container.style.opacity = '1';
        }, 80);
      });
    });

    // Initial render
    renderCategory('departamento');
  });
</script>
<!-- END: InteractiveTabLogic -->
</body></html>
